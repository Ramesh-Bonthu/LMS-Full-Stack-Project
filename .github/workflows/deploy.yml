name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm install
        working-directory: ./study-shine-joy-main
        
      - name: Build Project
        run: npm run build
        working-directory: ./study-shine-joy-main
        env:
          VITE_API_URL: https://lms-backend-api-jwgw.onrender.com/api
          
      - name: Create 404.html for SPA routing
        run: cp dist/client/index.html dist/client/404.html
        working-directory: ./study-shine-joy-main
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './study-shine-joy-main/dist/client'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
